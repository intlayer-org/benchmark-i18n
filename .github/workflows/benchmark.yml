name: Benchmark

# Every app is benchmarked independently: `plan` lists the apps whose inputs
# changed (see scripts/ci-plan.ts), each one runs in its own job with only its
# own dependencies installed, and `report` merges the fresh results over the
# committed ones in results/ so unchanged apps keep their last numbers.
#
# Size metrics (pages bundle/leakage, component size, lib size) are byte counts
# and stay stable on shared runners. Timing metrics (reactivity, rendering) are
# opt-in via workflow_dispatch. Hosted runners do not share one CPU model and
# each app lands on a different VM, so raw milliseconds are not comparable
# across jobs. To make them comparable anyway, a timing run:
#   - measures the framework's base app in the same job, right before the app,
#     and stores the app's median relative to it (`vsBaseline`);
#   - takes the median of $ITERATIONS samples and flags noisy runs (cv > 15 %);
#   - records the CPU model, runner image and Chromium version with the result.
# The image is pinned (ubuntu-24.04, not -latest) so it never changes silently.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      apps:
        description: '"all", comma-separated app names, or empty for apps changed since the previous commit'
        type: string
        default: all
      timing:
        description: Also run timing-sensitive tests (reactivity, rendering)
        type: boolean
        default: false
      runner:
        description: Runner label
        type: string
        default: ubuntu-24.04

concurrency:
  group: benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      apps: ${{ steps.plan.outputs.apps }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history for the diff, without downloading every blob of results/.
          fetch-depth: 0
          filter: blob:none

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - id: plan
        env:
          HAS_LINGO_KEY: ${{ secrets.LINGODOTDEV_API_KEY != '' }}
          APPS: ${{ inputs.apps }}
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before || 'HEAD~1' }}
        run: |
          if [ -n "$APPS" ]; then
            bun scripts/ci-plan.ts --apps "$APPS"
          else
            bun scripts/ci-plan.ts --base "$BASE"
          fi

  bench:
    needs: plan
    if: needs.plan.outputs.count != '0'
    name: ${{ matrix.app.name }}
    runs-on: ${{ inputs.runner || 'ubuntu-24.04' }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.plan.outputs.apps) }}
    env:
      LINGODOTDEV_API_KEY: ${{ secrets.LINGODOTDEV_API_KEY }}
      TIMING: ${{ inputs.timing == true }}
      BASE_NAME: ${{ matrix.app.base.name }}
      # Samples per timing test; the median is reported.
      ITERATIONS: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Cache bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ matrix.app.name }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-${{ matrix.app.name }}-

      - name: Install app dependencies
        run: |
          filters=(--filter '${{ matrix.app.name }}')
          if [ "$TIMING" = "true" ] && [ -n "$BASE_NAME" ]; then
            filters+=(--filter "$BASE_NAME")
          fi
          bun install --frozen-lockfile "${filters[@]}"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Install Chromium
        working-directory: ${{ matrix.app.path }}
        run: bunx playwright install --with-deps chromium

      - name: Cache build cache
        uses: actions/cache@v4
        with:
          path: ${{ matrix.app.path }}/.next/cache
          key: next-${{ matrix.app.name }}-${{ hashFiles('bun.lock') }}-${{ github.sha }}
          restore-keys: next-${{ matrix.app.name }}-${{ hashFiles('bun.lock') }}-

      - name: Build
        working-directory: ${{ matrix.app.path }}
        run: bun run build

      - name: Describe runner
        run: |
          {
            echo "### Runner"
            echo '```'
            lscpu | grep -E '^(Model name|CPU\(s\)|Thread|MHz|Hypervisor)' || true
            free -h | head -2
            echo "Image: ${ImageOS:-?} ${ImageVersion:-?}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Nothing below needs Docker; its daemons only add background CPU work.
      - name: Quiet the runner
        if: env.TIMING == 'true'
        run: sudo systemctl stop docker.socket docker.service containerd.service || true

      # Measured on this same VM, right before the app, so the app's timing can
      # be reported relative to it.
      - name: Baseline timing (${{ matrix.app.base.name }})
        if: env.TIMING == 'true' && env.BASE_NAME != ''
        working-directory: ${{ matrix.app.base.path }}
        run: |
          # results/ is committed: drop the old numbers so a failed run cannot
          # leave a stale baseline behind.
          rm -rf "$GITHUB_WORKSPACE/results/$BASE_NAME"
          bun run build
          for task in test:reactivity test:rendering; do
            echo "::group::baseline $task"
            bun run "$task" || echo "::warning::baseline $task failed; no vsBaseline ratio"
            echo "::endgroup::"
          done
          mkdir -p "$RUNNER_TEMP/baseline"
          cp "$GITHUB_WORKSPACE/results/$BASE_NAME"/{reactivity,rendering}-*.json "$RUNNER_TEMP/baseline/" 2>/dev/null || true
          echo "BASELINE_RESULTS_DIR=$RUNNER_TEMP/baseline" >> "$GITHUB_ENV"

      - name: Benchmark
        working-directory: ${{ matrix.app.path }}
        run: |
          # Keep only this app's results in the artifact.
          rm -rf "$GITHUB_WORKSPACE/results"

          TASKS="test:pages test:components test:lib-size"
          if [ "$TIMING" = "true" ]; then
            # Timing first, so it runs right after the baseline in the same state.
            TASKS="test:reactivity test:rendering $TASKS"
          fi

          status=0
          for task in $TASKS; do
            if [ "$(jq -r --arg t "$task" '.scripts[$t] // empty' package.json)" = "" ]; then
              echo "::notice::${{ matrix.app.name }} has no $task script"
              continue
            fi
            echo "::group::$task"
            bun run "$task" || { echo "::error::$task failed"; status=1; }
            echo "::endgroup::"
          done
          exit $status

      - name: Pack results
        if: always()
        run: |
          mkdir -p results
          # Raw bundle dumps are large and not read by the report.
          tar czf results.tgz --exclude='bundle' results

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ matrix.app.name }}
          path: results.tgz
          retention-days: 30

  report:
    needs: [plan, bench]
    if: always() && needs.plan.outputs.count != '0'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: actions/download-artifact@v4
        with:
          pattern: results-*
          path: artifacts

      - name: Merge fresh results over committed ones
        run: |
          for archive in artifacts/*/results.tgz; do
            tar xzf "$archive"
          done
          git status --short results | sed -n '1,200p'

      - name: Build report
        run: |
          bun run report
          echo "Re-measured: $(echo '${{ needs.plan.outputs.apps }}' | jq -r 'map(.name) | join(", ")')" >> "$GITHUB_STEP_SUMMARY"
          cat report/scripts/summarize-*.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-report
          path: |
            report/scripts/summarize-*.json
            report/scripts/summarize-*.md
            results/**
            !results/**/bundle/**

      # Only main keeps results: PR numbers stay in the artifact above. Pushes made
      # with GITHUB_TOKEN do not trigger workflows, so this cannot loop.
      - name: Commit results
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add results report/scripts/summarize-*.json report/scripts/summarize-*.md
          if git diff --cached --quiet; then
            echo "No result changes to commit"
            exit 0
          fi
          git commit -m "chore: update benchmark results [skip ci]" \
            -m "Re-measured: $(echo '${{ needs.plan.outputs.apps }}' | jq -r 'map(.name) | join(", ")')"
          # main may have moved while the benchmark ran; on conflicting result
          # files, keep the numbers from this run.
          for attempt in 1 2 3; do
            git pull --rebase -X theirs origin main && git push origin HEAD:main && exit 0
            sleep $((attempt * 5))
          done
          exit 1
